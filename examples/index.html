<!doctype html>
<!--
  An example page for the data that counting-lines writes with --js.
  Generate the data next to this file and open the page in a browser:

    python3 -m counting_lines /path/to/repo --js examples/loc.js

  No server or dependencies needed: loc.js sets the global LOC_DATA.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lines of code</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --grid: #d1d9e0; --panel: #f6f8fa;
    --other: #9ca3af;
    --c0: #2563eb; --c1: #16a34a; --c2: #d97706; --c3: #db2777;
    --c4: #7c3aed; --c5: #0891b2; --c6: #dc2626; --c7: #65a30d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --grid: #30363d; --panel: #161b22;
      --other: #6b7280;
      --c0: #60a5fa; --c1: #4ade80; --c2: #fbbf24; --c3: #f472b6;
      --c4: #a78bfa; --c5: #22d3ee; --c6: #f87171; --c7: #a3e635;
    }
  }
  body {
    margin: 0 auto; padding: 24px 16px; max-width: 1000px;
    background: var(--bg); color: var(--fg);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 16px 0 8px; }
  .chart { position: relative; }
  svg { display: block; width: 100%; height: auto; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 8px 0 24px; }
  .legend label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; user-select: none; }
  .legend input { display: none; }
  .legend .swatch { width: 10px; height: 10px; border-radius: 2px; }
  .legend input:not(:checked) + .swatch { opacity: 0.2; }
  .legend input:not(:checked) ~ span { color: var(--muted); text-decoration: line-through; }
  .tip {
    position: absolute; pointer-events: none; display: none; min-width: 180px;
    background: var(--panel); border: 1px solid var(--grid); border-radius: 6px;
    padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 12px rgb(0 0 0 / 0.15);
  }
  .tip table, .summary { border-collapse: collapse; width: 100%; }
  .tip td { padding: 1px 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .summary th, .summary td { padding: 4px 8px; border-bottom: 1px solid var(--grid); }
  .summary th { text-align: left; color: var(--muted); font-weight: 600; }
  code { font-size: 12px; }
</style>
</head>
<body>
<h1 id="title">Lines of code</h1>
<div id="subtitle" class="muted"></div>

<div class="controls">
  <label>Count
    <select id="metric">
      <option value="0">code</option>
      <option value="1">comments</option>
      <option value="2">blank lines</option>
      <option value="all">all lines</option>
    </select>
  </label>
  <label><input type="checkbox" id="slopes"> straight lines between commits</label>
</div>

<div class="chart">
  <svg id="chart" viewBox="0 0 960 360" role="img" aria-label="Lines of code over time"></svg>
  <div class="tip" id="tip"></div>
</div>
<div class="legend" id="legend"></div>

<table class="summary" id="summary"></table>

<script src="loc.js"></script>
<script>
"use strict";
const data = globalThis.LOC_DATA;
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const W = 960, H = 360, PAD = { l: 56, r: 16, t: 12, b: 28 };
const TOP = 8;  // languages with their own colour; the rest are lumped as "Other"

const fmt = (n) => n.toLocaleString("en");
const short = (n) => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M"
                  : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, "") + "k" : String(n);
const escape = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

if (!data || !data.points.length) {
  document.body.insertAdjacentHTML("beforeend",
    "<p>No data. Generate it with <code>python3 -m counting_lines REPO --js examples/loc.js</code>.</p>");
  throw new Error("LOC_DATA missing or empty");
}

const points = data.points.map((p) => ({ ...p, time: Date.parse(p.date) }));
const last = points[points.length - 1];

// Languages still present at the last commit get colours; vanished ones join "Other".
const current = data.languages.filter((l) => (last.langs[l] || [0])[0]);
const named = current.slice(0, TOP);
const rest = data.languages.filter((l) => !named.includes(l));
const series = named.map((name, i) => ({ name, langs: [name], color: `var(--c${i})` }));
if (rest.length) series.push({ name: "Other", langs: rest, color: "var(--other)" });
const visible = new Set(series.map((s) => s.name));

const title = data.project ? `${data.project}: lines of code` : "Lines of code";
$("title").textContent = title;
document.title = title;
$("subtitle").textContent =
  `${points.length.toLocaleString("en")} commits, ${points[0].date.slice(0, 10)} to ${last.date.slice(0, 10)}, ` +
  `up to ${data.rev.slice(0, 12)}`;

function value(point, s, metric) {
  let sum = 0;
  for (const lang of s.langs) {
    const v = point.langs[lang];
    if (v) sum += metric === "all" ? v[0] + v[1] + v[2] : v[+metric];
  }
  return sum;
}

function el(name, attrs, parent) {
  const node = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (parent) parent.appendChild(node);
  return node;
}

function niceMax(v) {
  if (v <= 0) return 1;
  const step = 10 ** Math.floor(Math.log10(v));
  return [1, 2, 2.5, 5, 10].map((m) => m * step).find((m) => m >= v);
}

let geometry = null;  // what the tooltip needs from the last draw

function draw() {
  const metric = $("metric").value;
  const slopes = $("slopes").checked;
  const shown = series.filter((s) => visible.has(s.name));
  const svg = $("chart");
  svg.replaceChildren();

  // Running sums per point: stacks[k][i] is the top of series i at point k.
  const stacks = points.map((p) => {
    let acc = 0;
    return shown.map((s) => (acc += value(p, s, metric)));
  });
  const top = Math.max(1, ...stacks.map((row) => row[row.length - 1] || 0));
  const ymax = niceMax(top);
  const t0 = points[0].time, t1 = last.time;
  const pw = W - PAD.l - PAD.r, ph = H - PAD.t - PAD.b;
  const sx = (t) => PAD.l + (t1 > t0 ? (t - t0) / (t1 - t0) : 1) * pw;
  const sy = (v) => PAD.t + ph - (v / ymax) * ph;
  const xs = points.map((p) => sx(p.time));

  // Grid and axes.
  for (let i = 0; i <= 4; i++) {
    const v = (ymax / 4) * i, y = sy(v);
    el("line", { x1: PAD.l, x2: W - PAD.r, y1: y, y2: y, stroke: "var(--grid)" }, svg);
    el("text", { x: PAD.l - 8, y: y + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" }, svg)
      .textContent = short(v);
  }
  const ticks = 6;
  for (let i = 0; i <= ticks; i++) {
    const t = t0 + ((t1 - t0) * i) / ticks;
    const span = (t1 - t0) / 864e5;
    const iso = new Date(t).toISOString();  // UTC
    const label = span > 3 * 365 ? iso.slice(0, 7) : span > 2 ? iso.slice(0, 10) : iso.slice(11, 16);
    el("text", {
      x: sx(t), y: H - 8, "font-size": 11, fill: "var(--muted)",
      "text-anchor": i === 0 ? "start" : i === ticks ? "end" : "middle",
    }, svg).textContent = label;
  }

  // One area per series, as steps: a count holds until the next commit.
  const line = (level) => {
    const out = [];
    xs.forEach((x, k) => {
      if (k && !slopes) out.push([x, sy(level(k - 1))]);
      out.push([x, sy(level(k))]);
    });
    return out;
  };
  shown.forEach((s, i) => {
    const upper = line((k) => stacks[k][i]);
    const lower = line((k) => (i ? stacks[k][i - 1] : 0)).reverse();
    const d = "M" + upper.concat(lower).map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join("L") + "Z";
    el("path", { d, fill: s.color, "fill-opacity": 0.85 }, svg);
  });

  const cursor = el("line", { y1: PAD.t, y2: PAD.t + ph, stroke: "var(--fg)", "stroke-opacity": 0.4, visibility: "hidden" }, svg);
  geometry = { xs, shown, metric, cursor };

  // Legend (toggles) and a table with the latest numbers.
  $("legend").replaceChildren(...series.map((s) => {
    const label = document.createElement("label");
    label.innerHTML = `<input type="checkbox" ${visible.has(s.name) ? "checked" : ""}>` +
      `<i class="swatch" style="background:${s.color}"></i>` +
      `<span>${escape(s.name)} ${value(last, s, metric) ? short(value(last, s, metric)) : ""}</span>`;
    label.querySelector("input").addEventListener("change", (e) => {
      e.target.checked ? visible.add(s.name) : visible.delete(s.name);
      draw();
    });
    return label;
  }));
}

function summary() {
  const rows = data.languages
    .map((lang) => [lang, last.langs[lang] || [0, 0, 0]])
    .filter(([, v]) => v[0] || v[1] || v[2]);
  $("summary").innerHTML =
    `<tr><th>Language at ${last.sha.slice(0, 12)}</th><th class="num">Code</th><th class="num">Comments</th><th class="num">Blank</th></tr>` +
    rows.map(([lang, v]) => `<tr><td>${escape(lang)}</td>${v.map((n) => `<td class="num">${fmt(n)}</td>`).join("")}</tr>`).join("") +
    `<tr><th>Total</th><th class="num">${fmt(last.code)}</th><th class="num">${fmt(last.comment)}</th><th class="num">${fmt(last.blank)}</th></tr>`;
}

// Tooltip: the commit in effect under the pointer (the last one at or before it).
$("chart").addEventListener("pointermove", (e) => {
  const svg = $("chart"), tip = $("tip");
  const box = svg.getBoundingClientRect();
  const x = ((e.clientX - box.left) / box.width) * W;
  const { xs, shown, metric, cursor } = geometry;
  let lo = 0, hi = xs.length - 1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (xs[mid] <= x) lo = mid; else hi = mid - 1;
  }
  const p = points[lo];
  cursor.setAttribute("x1", xs[lo]);
  cursor.setAttribute("x2", xs[lo]);
  cursor.setAttribute("visibility", "visible");
  const rows = shown.map((s) => [s, value(p, s, metric)]).filter(([, v]) => v).reverse();
  const total = rows.reduce((a, [, v]) => a + v, 0);
  tip.innerHTML =
    `<div><code>${p.sha.slice(0, 12)}</code> <span class="muted">${p.date.slice(0, 16).replace("T", " ")}</span></div>` +
    `<table>${rows.map(([s, v]) => `<tr><td><i class="swatch" style="display:inline-block;width:8px;height:8px;background:${s.color}"></i> ${escape(s.name)}</td><td class="num">${fmt(v)}</td></tr>`).join("")}` +
    `<tr><td><b>Total</b></td><td class="num"><b>${fmt(total)}</b></td></tr></table>`;
  tip.style.display = "block";
  const px = e.clientX - box.left, room = box.width - px;
  tip.style.left = (room > tip.offsetWidth + 24 ? px + 16 : px - tip.offsetWidth - 16) + "px";
  tip.style.top = Math.max(0, e.clientY - box.top - tip.offsetHeight / 2) + "px";
});
$("chart").addEventListener("pointerleave", () => {
  $("tip").style.display = "none";
  geometry.cursor.setAttribute("visibility", "hidden");
});

$("metric").addEventListener("change", draw);
$("slopes").addEventListener("change", draw);
draw();
summary();
</script>
</body>
</html>
